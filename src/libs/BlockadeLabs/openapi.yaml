openapi: 3.0.3
info:
  title: 'Blockade Labs API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'https://backend.blockadelabs.com'
paths:
  /api/v1/skybox:
    post:
      summary: 'Generate Skybox'
      operationId: generateSkybox
      description: 'Generate a Model 3 or Model 4 skybox on the same endpoint. Send application/json, or multipart/form-data when uploading an image. Model 4 styles and variant_id require a Standard or Business plan (Essential and Free receive 403). Remix, control, and init parameters are documented for Model 3. Model 2 is discontinued.'
      parameters:
        -
          in: header
          name: x-api-key
          description: ''
          example: '{YOUR_API_KEY}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 46
                  obfuscated_id: c60354672339614111cee85d21253244
                  user_id: 8
                  title: 'World #46'
                  prompt: 'dark forest'
                  seed: 50702979
                  negative_text: null
                  username: test
                  status: pending
                  queue_position: 1
                  file_url: ''
                  thumb_url: ''
                  depth_map_url: ''
                  remix_imagine_id: null
                  remix_obfuscated_id: null
                  isMyFavorite: false
                  created_at: '2023-08-21T13:35:14+00:00'
                  updated_at: '2023-08-21T13:35:14+00:00'
                  error_message: null
                  pusher_channel: status_update_c60354672339614111cee85d21253244
                  pusher_event: status_update
                  type: skybox
                  skybox_style_id: 2
                  skybox_id: 2
                  skybox_style_name: 'V2 Fantasy Lands'
                  skybox_name: 'V2 Fantasy Lands'
                properties:
                  id:
                    type: integer
                    example: 46
                    description: 'ID of your generation. It can be used to track generation progress or to cancel the generation'
                  obfuscated_id:
                    type: string
                    example: c60354672339614111cee85d21253244
                    description: 'Hash id of your generation'
                  user_id:
                    type: integer
                    example: 8
                    description: 'Your user id'
                  title:
                    type: string
                    example: 'World #46'
                    description: 'Generation title'
                  prompt:
                    type: string
                    example: 'dark forest'
                  seed:
                    type: integer
                    example: 50702979
                  negative_text:
                    type: string
                    example: null
                  username:
                    type: string
                    example: test
                    description: 'Your username'
                  status:
                    type: string
                    example: pending
                    description: "Initially status is set as 'pending' after you send a generation request. Status will change from one state to another and you will get updates for each one if you are using pusher or webhook: pending -> dispatched -> processing -> complete. Also you can get abort or error."
                  queue_position:
                    type: integer
                    example: 1
                    description: 'Position of your request in a generation queue'
                  file_url:
                    type: string
                    example: ''
                    description: 'Full size of generated image url (empty until generation is completed)'
                  thumb_url:
                    type: string
                    example: ''
                    description: 'Thumbnail of generated image url (empty until generation is completed)'
                  depth_map_url:
                    type: string
                    example: ''
                  remix_imagine_id:
                    type: string
                    example: null
                  remix_obfuscated_id:
                    type: string
                    example: null
                  isMyFavorite:
                    type: boolean
                    example: false
                  created_at:
                    type: string
                    example: '2023-08-21T13:35:14+00:00'
                    description: 'Time created'
                  updated_at:
                    type: string
                    example: '2023-08-21T13:35:14+00:00'
                    description: 'Time updated'
                  error_message:
                    type: string
                    example: null
                    description: 'If status=error here you should see the error message'
                  pusher_channel:
                    type: string
                    example: status_update_c60354672339614111cee85d21253244
                    description: 'Pusher channel name used to track generation progress'
                  pusher_event:
                    type: string
                    example: status_update
                    description: 'Pusher channel event used to track generation progress'
                  type:
                    type: string
                    example: skybox
                    description: 'Type of skybox generation'
                  skybox_style_id:
                    type: integer
                    example: 2
                    description: 'Skybox style id used in a generation request'
                  skybox_id:
                    type: integer
                    example: 2
                  skybox_style_name:
                    type: string
                    example: 'Open World'
                    description: 'Skybox style name used in a generation request'
                  variant_id:
                    type: integer
                    example: 1
                    description: 'Quality variant used for a Model 4 generation. Omitted for Model 3.'
                  model:
                    type: string
                    example: 'Model 4'
                    description: 'Model used for the generation.'
                  skybox_name:
                    type: string
                    example: 'V2 Fantasy Lands'
      tags:
        - Skyboxes
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                skybox_style_id:
                  type: integer
                  description: 'Style id from Get Skybox Styles. Chooses the model version and the aesthetic. Required.'
                  example: 155
                prompt:
                  type: string
                  description: 'Text prompt describing the skybox world you wish to create. Maximum number of characters: 2000, or the max-char value returned for the chosen style.'
                  example: 'dark forest'
                negative_text:
                  type: string
                  description: 'Things to avoid. Maximum number of characters: 600, or the negative-text-max-char value returned for the chosen style.'
                  example: ''
                enhance_prompt:
                  type: boolean
                  description: 'Have an AI automatically improve the prompt (default: false).'
                  example: false
                horizon_shift:
                  type: integer
                  minimum: -20
                  maximum: 20
                  description: 'Model 4 only. Not used for Model 3 generations. Defaults to 0. Negative shifts the horizon down, positive shifts it up. Accepted range: -20 to 20.'
                  example: 0
                variant_id:
                  type: integer
                  description: 'Model 4 quality variant from the variants array on Get Skybox Styles. 1 is Balance (3 credits, about 60s). 2 is Detail (6 credits, about 120s). If omitted, the style default is used. Required for Model 4 batches. Model 4 variants require a Standard or Business plan.'
                  example: 1
                soft_lines:
                  type: boolean
                  description: 'Model 4 only. Softer line rendering while preserving structural geometry. Default: false.'
                  example: false
                seed:
                  type: integer
                  description: 'Send 0 for a random seed. Any other number freezes the generator for a similar result with the same settings. Model 3 accepts 1-2147483647. Model 4 accepts 1-4294967295.'
                  example: 0
                webhook_url:
                  type: string
                  description: 'Optional URL for generation progress updates.'
                  example: ''
                max_wait:
                  type: integer
                  minimum: 30
                  maximum: 1800
                  description: 'Maximum seconds to wait for the generation. If it does not finish in time, status is set to error and credits are refunded. Accepted range: 30-1800. Model 3 and Model 4.'
                  example: 120
                remix_imagine_id:
                  type: integer
                  description: 'Model 3. ID of a previously generated skybox to remix.'
                  example: ''
                remix_collection_id:
                  type: integer
                  description: 'Model 3. ID of a project created in the web app. A random skybox from that project is used as the remix starting point.'
                  example: ''
                control_image:
                  type: string
                  format: binary
                  description: 'Model 3. Control image (binary, Base64, or absolute URL) that influences structure. Use with control_model set to remix.'
                control_image_hash:
                  type: string
                  description: 'Model 3. obfuscated_id of an existing skybox whose control image should be reused, instead of uploading control_image again.'
                  example: ''
                control_model:
                  type: string
                  description: 'Model 3. Model used for control_image. The only option is "remix".'
                  example: remix
                init_image:
                  type: string
                  format: binary
                  description: 'Model 3. Init image (binary, Base64, or absolute URL). Equirectangular images. Guides color and composition.'
                init_image_hash:
                  type: string
                  description: 'Model 3. obfuscated_id of an existing skybox whose init image should be reused, instead of uploading init_image again.'
                  example: ''
                init_strength:
                  type: number
                  minimum: 0.11
                  maximum: 0.9
                  description: 'Model 3. Inverted influence of init_image. 0.11 is lots of influence, 0.9 is no influence. Only applies when init_image is sent.'
                  example: 0.5
              required:
                - skybox_style_id
                - prompt
  /api/v1/skybox/batch:
    post:
      summary: 'Submit Skybox Batch'
      operationId: submitSkyboxBatch
      description: 'Queue multiple skyboxes in one request. Accepts the same parameters as Generate Skybox, plus quantity. Essential and Standard allow batches up to 3 credits. Business allows up to 30. Free cannot use batches. Model 4 batches also require a Standard or Business plan and variant_id. Only one batch can be in progress per account (409).'
      parameters:
        -
          in: header
          name: x-api-key
          description: ''
          example: '{YOUR_API_KEY}'
          schema:
            type: string
      tags:
        - Skyboxes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  description: 'Number of skyboxes to generate. Required. Total credit cost is quantity times credits per generation, and must fit the plan batch cap and the account balance.'
                  example: 3
                skybox_style_id:
                  type: integer
                  description: 'Style id from Get Skybox Styles. Required.'
                  example: 155
                prompt:
                  type: string
                  description: 'Text prompt. Maximum 2000 characters, or the style max-char.'
                  example: 'dark forest'
                negative_text:
                  type: string
                  description: 'Things to avoid. Maximum 600 characters, or the style negative-text-max-char.'
                enhance_prompt:
                  type: boolean
                  description: 'Automatically improve the prompt. Default: false.'
                  example: false
                horizon_shift:
                  type: integer
                  minimum: -20
                  maximum: 20
                  description: 'Model 4 only. Not used for Model 3 generations. Default 0. Range -20 to 20.'
                  example: 0
                variant_id:
                  type: integer
                  description: 'Required for Model 4 batches. 1 is Balance, 2 is Detail, or another id from the style variants array.'
                  example: 1
                soft_lines:
                  type: boolean
                  description: 'Model 4 only. Default: false.'
                  example: false
                seed:
                  type: integer
                  description: '0 for a random seed. Model 3 accepts 1-2147483647. Model 4 accepts 1-4294967295.'
                  example: 0
                max_wait:
                  type: integer
                  minimum: 30
                  maximum: 1800
                  description: 'Per-generation wait limit in seconds. Range 30-1800.'
                  example: 120
                webhook_url:
                  type: string
                  description: 'Optional URL for batch-level status updates. The payload matches the batch object.'
              required:
                - quantity
                - skybox_style_id
                - prompt
      responses:
        200:
          description: 'Batch accepted. status starts at pending. generations lists each queued skybox.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 42
                  obfuscated_id:
                    type: string
                  status:
                    type: string
                    description: 'pending, dispatched, processing, finalized, error, or abort.'
                    example: pending
                  quantity:
                    type: integer
                    example: 3
                  successfully_submitted:
                    type: integer
                    example: 3
                  completed:
                    type: integer
                    example: 0
                  errored:
                    type: integer
                    example: 0
                  aborted:
                    type: integer
                    example: 0
                  pusher_channel:
                    type: string
                  pusher_event:
                    type: string
                    example: status_update
                  webhook_url:
                    type: string
                    nullable: true
                  submission_errors:
                    type: array
                    description: 'Generations that failed during submit. Each item has index, message, and status.'
                    items:
                      type: object
                  generations:
                    type: array
                    items:
                      type: object
        403:
          description: 'No active subscription, or batch generation is not available on the current plan.'
        404:
          description: 'Skybox style does not exist.'
        409:
          description: 'A batch is already being processed for this account.'
        422:
          description: 'Invalid quantity or variant_id, or the batch exceeds the plan credit cap or the account balance.'
        503:
          description: 'Generations are temporarily disabled.'
    get:
      summary: 'Get Skybox Batches'
      operationId: getSkyboxBatches
      description: 'Paginated list of batch requests for the account.'
      parameters:
        -
          in: header
          name: x-api-key
          description: ''
          example: '{YOUR_API_KEY}'
          schema:
            type: string
        -
          in: query
          name: limit
          description: 'Results per page. 1-100, default 18.'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 18
        -
          in: query
          name: offset
          description: 'Records to skip. Default 0.'
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        -
          in: query
          name: order
          description: 'ASC or DESC. Default DESC.'
          required: false
          schema:
            type: string
            enum:
              - ASC
              - DESC
            default: DESC
        -
          in: query
          name: status
          description: 'Filter by batch status.'
          required: false
          schema:
            type: string
            enum:
              - pending
              - dispatched
              - processing
              - finalized
              - error
              - abort
        -
          in: query
          name: batch_id
          description: 'Filter to one batch id.'
          required: false
          schema:
            type: integer
      tags:
        - Skyboxes
      responses:
        200:
          description: 'A page of batches in data, with pagination metadata.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
  /api/v1/skybox/styles:
    get:
      summary: 'Get Skybox Styles'
      operationId: getSkyboxStyles
      description: 'Returns the list of predefined styles that can influence the overall aesthetic of your skybox generation.'
      parameters:
        -
          in: query
          name: model_version
          description: 'Filter skybox styles by model version number ("3" or "4"). Model 2 is discontinued.'
          example: ''
          required: false
          schema:
            type: string
            description: 'Filter skybox styles by model version number ("3" or "4"). Model 2 is discontinued.'
            example: ''
        -
          in: header
          name: x-api-key
          description: ''
          example: '{YOUR_API_KEY}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 2
                      description: "To be used as 'skybox_style_id' parameter in the 'Generate skybox' endpoint to influence the overall aesthetic of your skybox generation"
                    name:
                      type: string
                      example: Fantasy
                      description: 'Name of the style'
                    description:
                      type: string
                      example: 'Classic fantasy subject matter concept art renderings'
                      description: 'Description of the style'
                    max-char:
                      type: integer
                      example: 370
                      description: "Maximum number of characters that can be used for 'prompt' in the 'Generate skybox' endpoint"
                    negative-text-max-char:
                      type: integer
                      example: 220
                      description: "Maximum number of characters that can be used for 'negative_text' in the 'Generate skybox' endpoint"
                    image:
                      type: string
                      example: 'https://images.blockadelabs.com/images/skybox/4R0ACI1zHpLoOT8gGGu0dEe4QEzoMelaWGavSqPk.webp'
                      description: 'Webp image example of the style'
                    image_jpg:
                      type: string
                      example: 'https://images.blockadelabs.com/images/skybox/4R0ACI1zHpLoOT8gGGu0dEe4QEzoMelaWGavSqPk.jpg'
                      description: 'JPG image example of the style'
                    model:
                      type: string
                      example: 'Model 2'
                      description: 'Model name'
                    model_version:
                      type: string
                      example: '2'
                      description: 'Model version number'
                    sort_order:
                      type: integer
                      example: 20
                      description: 'Sorting order'
                    premium:
                      type: integer
                      example: 0
                      description: 'Shows if the style is premium'
                    new:
                      type: integer
                      example: 0
                      description: 'Shows if the style is new'
                    experimental:
                      type: integer
                      example: 0
                      description: 'Shows if the style is experimental'
                    skybox_style_families_id:
                      type: integer
                      example: 3
                      description: 'ID of the family the style belongs to'
                example:
                  -
                    id: 2
                    name: Fantasy
                    description: 'Classic fantasy subject matter concept art renderings'
                    max-char: 370
                    negative-text-max-char: 220
                    image: 'https://images.blockadelabs.com/images/skybox/4R0ACI1zHpLoOT8gGGu0dEe4QEzoMelaWGavSqPk.webp'
                    image_jpg: 'https://images.blockadelabs.com/images/skybox/4R0ACI1zHpLoOT8gGGu0dEe4QEzoMelaWGavSqPk.jpg'
                    model: 'Model 2'
                    model_version: '2'
                    sort_order: 20
                    premium: 0
                    new: 0
                    experimental: 0
                    skybox_style_families_id: 3
                  -
                    id: 43
                    name: 'Art Mix'
                    description: 'Multimedia painterly art that pulls from watercolor, marker, paint, pastels, and more'
                    max-char: 412
                    negative-text-max-char: 210
                    image: 'https://images.blockadelabs.com/images/skybox/MYklQhpxG7wbn7HkftNTNxLZMc5mBjYvUuRajHpp.webp'
                    image_jpg: 'https://images.blockadelabs.com/images/skybox/MYklQhpxG7wbn7HkftNTNxLZMc5mBjYvUuRajHpp.jpg'
                    model: 'Model 2'
                    model_version: '2'
                    sort_order: 6
                    premium: 0
                    new: 0
                    experimental: 0
                    skybox_style_families_id: 7
      tags:
        - Skyboxes
  /api/v1/skybox/families:
    get:
      summary: 'Get Skybox Style Families'
      operationId: getSkyboxStyleFamilies
      description: 'Returns the list of predefined styles that can influence the overall aesthetic of your skybox generation, sorted by style family. This route can be used in order to build a menu of styles sorted by family.'
      parameters:
        -
          in: header
          name: x-api-key
          description: ''
          example: '{YOUR_API_KEY}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      example: family
                      description: "Can be of type 'family' or 'style' if the style doesn't belong to any families"
                    id:
                      type: integer
                      example: 17
                      description: 'ID of a type'
                    name:
                      type: string
                      example: 'Model 3 Realistic'
                      description: 'Name of the menu item'
                    sort_order:
                      type: integer
                      example: 1
                      description: 'Ascending order position in the menu'
                    items:
                      type: array
                      example:
                        -
                          type: style
                          id: 119
                          name: 'M3 Photoreal (Featured)'
                          sort_order: 1
                          description: 'Photographic realism with a high degree of flexibility and good visual fidelity'
                          max-char: 600
                          negative-text-max-char: 410
                          image: 'https://images.blockadelabs.com/images/skybox/WJgTolgUIXCDZM5LOTeUR2T8IOfZHnq2OQzozqH0.webp'
                          image_jpg: 'https://images.blockadelabs.com/images/skybox/WJgTolgUIXCDZM5LOTeUR2T8IOfZHnq2OQzozqH0.jpg'
                          model: 'Model 3'
                          model_version: '3'
                        -
                          type: style
                          id: 102
                          name: 'M3 Cinematic Realism'
                          sort_order: 2
                          description: 'Photographic realism with dramatic, dark color grading and filmic mood'
                          max-char: 600
                          negative-text-max-char: 430
                          image: 'https://images.blockadelabs.com/images/skybox/gGfOHzfOiAgvkVxHVtg6TDNwWa22SvTluHoRJNTK.webp'
                          image_jpg: 'https://images.blockadelabs.com/images/skybox/gGfOHzfOiAgvkVxHVtg6TDNwWa22SvTluHoRJNTK.jpg'
                          model: 'Model 3'
                          model_version: '3'
                      description: 'Collection of styles that belong to a family'
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            example: style
                            description: 'Refers to a skybox style type found within a specific family'
                          id:
                            type: integer
                            example: 119
                            description: "To be used as 'skybox_style_id' parameter in the 'Generate skybox' endpoint to influence the overall aesthetic of your skybox generation"
                          name:
                            type: string
                            example: 'M3 Photoreal (Featured)'
                            description: 'Name of the style'
                          sort_order:
                            type: integer
                            example: 1
                            description: 'Ascending order position inside a family'
                          description:
                            type: string
                            example: 'Photographic realism with a high degree of flexibility and good visual fidelity'
                            description: 'This is a description of this style (string/nullable)'
                          max-char:
                            type: integer
                            example: 600
                            description: "Maximum number of characters that can be used for 'prompt' in the 'Generate skybox' endpoint"
                          negative-text-max-char:
                            type: integer
                            example: 410
                            description: "Maximum number of characters that can be used for 'negative_text' in the 'Generate skybox' endpoint"
                          image:
                            type: string
                            example: 'https://images.blockadelabs.com/images/skybox/WJgTolgUIXCDZM5LOTeUR2T8IOfZHnq2OQzozqH0.webp'
                            description: 'Webp image example of the style'
                          image_jpg:
                            type: string
                            example: 'https://images.blockadelabs.com/images/skybox/WJgTolgUIXCDZM5LOTeUR2T8IOfZHnq2OQzozqH0.jpg'
                            description: 'JPG image example of the style'
                          model:
                            type: string
                            example: 'Model 3'
                            description: 'Model name'
                          model_version:
                            type: string
                            example: '3'
                            description: 'Model version number'
                example:
                  -
                    type: family
                    id: 17
                    name: 'Model 3 Realistic'
                    sort_order: 1
                    items:
                      -
                        type: style
                        id: 119
                        name: 'M3 Photoreal (Featured)'
                        sort_order: 1
                        description: 'Photographic realism with a high degree of flexibility and good visual fidelity'
                        max-char: 600
                        negative-text-max-char: 410
                        image: 'https://images.blockadelabs.com/images/skybox/WJgTolgUIXCDZM5LOTeUR2T8IOfZHnq2OQzozqH0.webp'
                        image_jpg: 'https://images.blockadelabs.com/images/skybox/WJgTolgUIXCDZM5LOTeUR2T8IOfZHnq2OQzozqH0.jpg'
                        model: 'Model 3'
                        model_version: '3'
                      -
                        type: style
                        id: 102
                        name: 'M3 Cinematic Realism'
                        sort_order: 2
                        description: 'Photographic realism with dramatic, dark color grading and filmic mood'
                        max-char: 600
                        negative-text-max-char: 430
                        image: 'https://images.blockadelabs.com/images/skybox/gGfOHzfOiAgvkVxHVtg6TDNwWa22SvTluHoRJNTK.webp'
                        image_jpg: 'https://images.blockadelabs.com/images/skybox/gGfOHzfOiAgvkVxHVtg6TDNwWa22SvTluHoRJNTK.jpg'
                        model: 'Model 3'
                        model_version: '3'
                  -
                    type: style
                    id: 13
                    name: 'Advanced (no style)'
                    sort_order: 17
                    description: null
                    max-char: 540
                    negative-text-max-char: 220
                    image: null
                    image_jpg: null
                    model: 'Model 2'
                    model_version: '2'
      tags:
        - Skyboxes
  '/api/v1/imagine/requests/{id}':
    get:
      summary: 'Get Skybox by id'
      operationId: getSkyboxById
      description: ''
      parameters:
        -
          in: header
          name: x-api-key
          description: ''
          example: '{YOUR_API_KEY}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  request:
                    id: 46
                    obfuscated_id: c60354672339614111cee85d21253244
                    user_id: 8
                    title: 'World #46'
                    prompt: 'dark forest'
                    seed: 50702979
                    negative_text: null
                    username: test
                    status: complete
                    queue_position: 0
